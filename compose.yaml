services:
  api:
    build: .
    env_file:
      - path: .env  # optional: copy .env.example to .env to change settings
        required: false
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-for-anything-public}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
    volumes:
      - api-data:/app/var

volumes:
  api-data:
